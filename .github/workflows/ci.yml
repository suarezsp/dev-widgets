# Runs on every push and pull request. The macOS job builds the
# app and widget targets without signing.
name: CI
on: [push, pull_request]
jobs:
  core-linux:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - run: python3 tools/check_style.py
  # The GTK app and its packages need the GTK 4 and libadwaita
  # headers, so they get their own job (Ubuntu 24.04: libadwaita
  # 1.5), once per architecture; each runner builds its own.
  linux-app:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: >-
          apt-get update && apt-get install -y --no-install-recommends
          libgtk-4-dev libadwaita-1-dev dpkg-dev rpm
      - run: tools/package_deb.sh
      - run: tools/package_rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: devwidgets-linux-${{ matrix.runner }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
  # macos-26 is Apple silicon with Xcode 26.
  macos-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen swiftlint
      - run: swiftlint lint --strict
      - run: swift test
      - run: cd macOS && xcodegen generate
      - run: >-
          xcodebuild -project macOS/DevWidgets.xcodeproj
          -scheme DevWidgetsApp -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
