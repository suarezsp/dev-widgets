# XcodeGen spec: `brew install xcodegen && xcodegen generate`
# inside macOS/, then open DevWidgets.xcodeproj in Xcode 26.
# Set DEVELOPMENT_TEAM below to your own team.
name: DevWidgets
options:
  bundleIdPrefix: com.morsetechnologies
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Your Apple team (Xcode › Settings › Accounts). Signing is
    # automatic; nothing else names the team.
    DEVELOPMENT_TEAM: TZX43BGUAU
    CODE_SIGN_STYLE: Automatic
    # Team-prefixed App Group ("TEAMID.name"): on macOS it needs no
    # registration or provisioning profile and never prompts the
    # user (macOS 15+). Both targets read it from Info.plist.
    APP_GROUP_IDENTIFIER: >-
      $(TeamIdentifierPrefix)com.morsetechnologies.devwidgets
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  DevWidgets:
    path: ..
targets:
  DevWidgetsApp:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.morsetechnologies.devwidgets
        PRODUCT_NAME: DevWidgets
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: DevWidgets
        DevWidgetsAppGroup: $(APP_GROUP_IDENTIFIER)
    entitlements:
      path: App/DevWidgets.entitlements
      # Not sandboxed: libproc only lists other processes outside
      # the App Sandbox. The widget extension stays sandboxed and
      # only reads the shared snapshot file.
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - package: DevWidgets
        product: DevWidgetsCore
      - package: DevWidgets
        product: DevWidgetsDarwin
      - sdk: IOKit.framework
      - target: DevWidgetsWidgets
  DevWidgetsWidgets:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: >-
          com.morsetechnologies.devwidgets.widgets
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DevWidgets
        DevWidgetsAppGroup: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/DevWidgetsWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    dependencies:
      - package: DevWidgets
        product: DevWidgetsCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
